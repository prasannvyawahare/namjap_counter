name: namjap_counter
description: "Namjap Counter - Track your spiritual mantra chanting journey."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.3.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Hardware / feedback
  vibration: ^2.0.0
  flutter_volume_controller: ^1.3.3

  # Keep the screen on while counting
  wakelock_plus: ^1.2.10

  # Sharing
  share_plus: ^10.1.4

  # Local reminder notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Formatting
  intl: ^0.20.2

  # Nice-to-have
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  # App launcher icon generation
  flutter_launcher_icons: ^0.14.1

# Launcher icon config — same saffron "self_improvement" mark as the splash /
# welcome screen. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
